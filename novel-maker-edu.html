<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ノベルゲームメーカー きょういく版</title>
<style>
:root{
  --bg:#0f1d45;--pn:#182a5e;--pn2:#22397a;--ln:#4a64a8;--tx:#fff;--sub:#b9c6ec;--acc:#ffd257;--red:#ff6b6b;
  --fui:"BIZ UDPGothic","BIZ UDPゴシック","Noto Sans CJK JP","Noto Sans JP",sans-serif;
  --ftx:"UD デジタル 教科書体 NK-R","UD Digi Kyokasho NK-R","UD デジタル 教科書体 N-R","BIZ UDPGothic","BIZ UDPゴシック","Noto Sans CJK JP",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0a1330;font-family:var(--fui);color:var(--tx);user-select:none}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:var(--bg);overflow:hidden}
.screen{position:absolute;left:0;top:0;width:100%;height:720px;display:none}
.screen.show{display:block}
.abs{position:absolute}
.ic{display:inline-flex;width:22px;height:22px;flex:none}
.ic svg{width:100%;height:100%}
/* ボタン */
.btn{font-family:var(--fui);font-size:20px;height:52px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--pn2);color:var(--tx);border:2px solid var(--ln);border-radius:10px;cursor:pointer;white-space:nowrap;overflow:hidden;flex:none}
.btn:hover:not(:disabled){border-color:var(--acc)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.35;cursor:default}
.btn.on{background:#0b1638;border-color:var(--acc);color:var(--acc)}
.btn.sm{height:44px;font-size:18px;padding:0 6px}
.btn.tight{font-size:16px;padding:0 2px;gap:3px}
.btn.tight .ic{width:17px;height:17px}
.btn.sm .ic{width:20px;height:20px}
.btn.xs2{height:40px;font-size:16px;padding:0 4px}
.btn.xs{height:32px;width:32px;padding:0;font-size:14px;border-radius:8px}
.btn.xs .ic{width:16px;height:16px}
.btn.sq{width:44px;padding:0}
.btn.big{width:440px;height:68px;font-size:26px}
.btn.big .ic{width:28px;height:28px}
.btn.tl{position:absolute;left:20px;top:14px;width:120px}
.btn.tr{position:absolute;right:20px;top:14px;width:120px}
.btn.tab{padding:0 8px}
.w96{width:96px}.w122{width:122px}.w140{width:140px}.w160{width:160px}.w320{width:320px}.w380{width:380px}.w440{width:440px}
.row{display:flex;gap:6px;align-items:center}
/* 入力 */
.inp{font-family:var(--fui);font-size:22px;height:52px;width:100%;padding:0 14px;border-radius:10px;border:2px solid var(--ln);background:#0b1638;color:var(--tx);outline:none}
.inp.sm{height:44px;font-size:18px}
.inp:focus{border-color:var(--acc)}
.sel{font-family:var(--fui);font-size:17px;height:40px;border-radius:8px;border:2px solid var(--ln);background:#0b1638;color:var(--tx);padding:0 6px;outline:none}
.ta{font-family:var(--ftx);font-size:24px;line-height:1.6;padding:14px 18px;border-radius:12px;border:2px solid var(--ln);background:#0b1638;color:var(--tx);resize:none;outline:none;scrollbar-width:none;user-select:text}
.ta::-webkit-scrollbar{display:none}
.ta:focus{border-color:var(--acc)}
.hint{font-size:17px;color:var(--sub);display:flex;align-items:center;line-height:1.3}
/* トースト・モーダル */
#toast{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);max-width:1100px;background:#000c;color:#fff;border:2px solid var(--acc);padding:12px 22px;border-radius:12px;font-size:19px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:200;text-align:center;line-height:1.4}
#toast.show{opacity:1}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:100}
.dlg{background:var(--pn);border:3px solid var(--ln);border-radius:16px;padding:24px 28px;color:var(--tx);font-family:var(--fui);max-width:1240px}
.dlg-title{font-size:24px;font-weight:bold;margin-bottom:18px;line-height:1.3}
.dlg-msg{font-size:24px;text-align:center;margin:8px 0 6px;line-height:1.4}
.dlg-sub{font-size:18px;text-align:center;color:var(--sub);margin-bottom:6px}
.dlg-btns{display:flex;justify-content:center;gap:14px;margin-top:20px}
.dlg-btns .btn{min-width:180px}
.dlg-ask{min-width:560px}
/* タイトル */
.tt-logo{position:absolute;left:0;right:0;top:120px;text-align:center;font-size:64px;font-weight:bold;letter-spacing:4px;color:#fff;text-shadow:0 4px 0 #0008}
.tt-sub{position:absolute;left:0;right:0;top:210px;text-align:center;font-size:26px;color:var(--acc)}
.tt-btns{position:absolute;left:420px;top:300px;width:440px;display:flex;flex-direction:column;gap:22px}
/* 作品えらび */
.sc-title{position:absolute;left:160px;right:160px;top:14px;height:52px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:bold}
.cards{position:absolute;left:50px;top:96px;width:1180px;height:530px;display:grid;grid-template-columns:repeat(3,380px);grid-template-rows:repeat(2,255px);gap:20px}
.card{background:var(--pn);border:3px solid var(--ln);border-radius:14px;padding:16px 18px;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:6px;overflow:hidden;color:var(--tx);font-family:var(--fui);text-align:left}
.card:hover{border-color:var(--acc)}
.card.locked{opacity:.6}
.card-new{align-items:center;justify-content:center;font-size:26px;gap:12px;border-style:dashed}
.card-t{font-size:26px;font-weight:bold;line-height:1.25;height:66px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card-a{font-size:18px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;gap:6px;flex-wrap:nowrap;height:30px}
.tag{font-size:15px;padding:0 10px;height:28px;display:inline-flex;align-items:center;gap:4px;border-radius:14px;background:#0b1638;border:1px solid var(--ln);white-space:nowrap}
.tag .ic{width:15px;height:15px}
.tag.recv{border-color:var(--acc);color:var(--acc)}
.tag.lock{border-color:var(--red);color:var(--red)}
.card-d{font-size:16px;color:var(--sub)}
.card-btns{position:absolute;left:18px;right:18px;bottom:14px;display:flex;gap:10px}
.card-btns .btn{flex:1}
.empty-msg{grid-column:1/4;font-size:22px;color:var(--sub);text-align:center;padding-top:200px}
.pager{position:absolute;left:0;right:0;top:646px;display:flex;justify-content:center;align-items:center;gap:16px}
.pager .btn{width:140px}
.pg-n{width:110px;text-align:center;font-size:22px}
.pg-n.sm{font-size:18px;width:80px}
.pager2{display:flex;justify-content:space-between;align-items:center}
.pager2 .btn{width:140px}
/* 新しく作る */
.dlg-wz{width:900px}
.wz-row{display:flex;align-items:center;gap:12px;height:58px;margin-bottom:6px}
.wz-row.off{opacity:.4}
.wz-l{width:190px;font-size:20px;flex:none}
.wz-row .btn.opt{width:300px}
.wz-row .inp{width:612px}
/* 設定 */
.dlg-set{width:1000px;height:600px;display:flex;flex-direction:column}
.set-tabs{display:flex;gap:10px;margin-bottom:16px}
.set-tabs .btn{width:200px}
.set-body{flex:1}
.set-row{display:flex;align-items:center;gap:10px;height:56px;margin-bottom:8px}
.set-l{width:240px;font-size:20px;flex:none}
.set-row .btn.opt{width:160px}
.set-data{margin-top:26px}
.set-data .btn{width:290px}
.set-note{font-size:16px;color:var(--sub);margin-top:12px}
/* ===== 再生 ===== */
#scr-play{background:#000;cursor:pointer}
.pv{position:absolute;inset:0;background:var(--wui-p);overflow:hidden}
.lay{position:absolute;inset:0;pointer-events:none}
.bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.chimg{position:absolute;bottom:0;transform:translateX(-50%);object-fit:contain;max-width:none}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
@keyframes flash{0%{opacity:0}35%{opacity:1}100%{opacity:0}}
.pwin{position:absolute;background:var(--wwin);border:3px solid var(--wui-l);border-radius:16px;color:var(--wtx);font-family:var(--ftx);overflow:hidden}
.prow{white-space:nowrap;height:1.5em}
.pname{position:absolute;height:40px;padding:0 22px;display:none;line-height:40px;font-size:22px;border-radius:10px 10px 0 0;background:var(--wui);color:var(--wtx);border:3px solid var(--wui-l);border-bottom:none;font-family:var(--ftx)}
.pmark{position:absolute;height:30px;display:flex;justify-content:flex-end;align-items:center;gap:14px;font-size:18px;color:var(--wtx);text-shadow:0 1px 2px #000a;pointer-events:none}
.pmark .tri{animation:tri 1s infinite;font-size:18px}
@keyframes tri{50%{transform:translateY(4px)}}
.pbar .btn{position:absolute;top:14px;background:var(--wui);border-color:var(--wui-l);color:var(--wtx)}
.pbar .btn.on{background:var(--wui-d);border-color:var(--acc);color:var(--acc)}
.pbar .btn.narrow{font-size:17px;padding:0 4px;gap:4px}
.pbar .btn.narrow .ic{width:18px;height:18px}
.hid .pwin,.hid .pname,.hid .pmark,.hid .pbar,.hid .pchoices{display:none!important}
.pchoices{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;pointer-events:none}
.pchoices .btn.pch{pointer-events:auto;width:70%;height:64px;font-size:24px;font-family:var(--ftx);background:var(--wui);border:3px solid var(--wui-l);color:var(--wtx)}
.pchoices .btn.pch:hover{border-color:var(--acc)}
.ppanel{position:absolute;inset:0;z-index:50;cursor:default}
.pend{background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
.pend .dlg{min-width:640px;text-align:center;background:var(--wui);border-color:var(--wui-l);color:var(--wtx)}
.pend .btn{background:var(--wui-d);border-color:var(--wui-l);color:var(--wtx)}
.pend-t{font-size:40px;font-family:var(--ftx);margin:6px 0 10px}
.pend-s{font-size:22px;font-family:var(--ftx)}
.ptitle{background:var(--wui-p)}
.ptitle .btn.pb{background:var(--wui);border-color:var(--wui-l);color:var(--wtx)}
.ptitle-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.ptitle-box{position:absolute;left:0;right:0;bottom:60px;display:flex;flex-direction:column;align-items:center;gap:10px}
.ptitle-t{font-family:var(--ftx);font-size:56px;color:var(--wtx);background:var(--wwin);border:3px solid var(--wui-l);border-radius:16px;padding:10px 40px;max-width:90%;text-align:center;line-height:1.25}
.ptitle-a{font-family:var(--ftx);font-size:22px;color:var(--wtx);background:var(--wwin);border-radius:10px;padding:4px 18px}
.ptitle-btns{display:flex;gap:16px;margin-top:14px}
.ptitle-btns .btn{width:220px;background:var(--wui);border-color:var(--wui-l);color:var(--wtx)}
.dlg-sl{width:1000px}
.slgrid{display:grid;grid-template-columns:repeat(3,300px);grid-template-rows:repeat(2,150px);gap:20px;justify-content:center}
.slot{font-family:var(--fui);background:var(--pn2);border:2px solid var(--ln);border-radius:12px;color:var(--tx);text-align:left;padding:12px 16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.slot:hover:not(:disabled){border-color:var(--acc)}
.slot:disabled{opacity:.4;cursor:default}
.slot-n{font-size:22px;font-weight:bold}
.slot-b{font-size:16px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot-s{font-size:17px;font-family:var(--ftx);line-height:1.35;height:46px;overflow:hidden}
/* ===== 作る ===== */
.ed-body{position:absolute;inset:0}
.map-svg{position:absolute;left:0;top:0;pointer-events:none;z-index:1}
.svgt{font-family:var(--fui)}
.ep-head{font-size:18px;color:var(--sub);display:flex;align-items:center;justify-content:center;border-bottom:2px solid var(--ln)}
.ep-head.dim{opacity:.35}
.bcard{background:var(--pn);border:3px solid var(--ln);border-radius:12px;padding:8px 10px;cursor:pointer;z-index:2;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.bcard:hover{border-color:#8fa6e6}
.bcard.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.bcard.pickable{border-color:#74c0fc;border-style:dashed}
.bcard.nopick{opacity:.4}
.bc-top{display:flex;justify-content:space-between;align-items:center;height:32px}
.bc-l{font-size:24px;font-weight:bold}
.bc-iss{display:flex;gap:2px}
.iss{width:28px;height:28px;border:none;background:#0b1638;border-radius:6px;padding:3px;cursor:pointer;display:flex}
.iss .ic{width:22px;height:22px}
.bc-txt{font-family:var(--ftx);font-size:15px;line-height:1.35;height:62px;overflow:hidden;color:#dfe6ff;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.bc-end{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--acc);height:22px;white-space:nowrap;overflow:hidden}
.bc-end .ic{width:18px;height:18px}
.card-empty{z-index:2;border:3px dashed #3a5291;background:transparent;border-radius:12px;color:var(--sub);font-family:var(--fui);font-size:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.card-empty:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
.card-empty:disabled{opacity:.25;cursor:default}
.card-empty.pickable{border-color:#74c0fc;color:#74c0fc}
.map-bar{display:flex;align-items:center;gap:12px}
.map-bar .btn{width:120px}
.chk-sum{display:flex;align-items:center;gap:8px;font-size:17px;color:#8ce99a;margin-left:12px;white-space:nowrap}
.chk-sum.bad{color:#ffa94d}
.pick-msg{display:flex;align-items:center;gap:8px;font-size:20px;color:#74c0fc;flex:1}
.panel{background:var(--pn);border:2px solid var(--ln);border-radius:14px;padding:14px 14px}
.bpanel{display:flex;flex-direction:column;gap:8px}
.bp-head{display:flex;justify-content:space-between;align-items:center;height:44px}
.bp-head .btn{width:100px}
.bp-l{font-size:24px;font-weight:bold}
.bp-row{display:flex;gap:8px}
.bp-cap{font-size:16px;color:var(--sub);margin-top:4px}
.bp-grid{display:grid;grid-template-columns:160px 160px;gap:8px}
.bp-detail{display:flex;flex-direction:column;gap:8px;margin-top:6px;flex:1}
.bp-line{display:flex;align-items:center;gap:8px;height:44px}
.bp-k{width:88px;font-size:17px;flex:none}
.bp-k.wide{width:224px}
.bp-k.abc{width:34px;height:34px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#0b1638}
.abc.c0{background:#ffd257}.abc.c1{background:#74c0fc}.abc.c2{background:#8ce99a}
.bp-line .inp.sm{flex:1;min-width:0}
.btn.tgt{flex:none;padding:0 6px;font-size:17px}
.btn.tgt.none{border-style:dashed;color:#74c0fc}
.bp-rule{display:flex;gap:8px;height:56px}
.rule-txt{flex:1;min-width:0;text-align:left;font-family:var(--fui);font-size:14px;line-height:1.3;color:var(--tx);background:#0b1638;border:2px solid var(--ln);border-radius:8px;padding:4px 8px;cursor:pointer;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rule-txt:hover{border-color:var(--acc)}
.bp-iss{display:flex;align-items:center;gap:6px;font-size:15px;color:#8ce99a;height:40px;line-height:1.3;overflow:hidden}
.bp-iss.bad{color:#ffa94d}
.bp-iss .ic{width:18px;height:18px}
.dlg-rule{width:1220px;height:640px;display:flex;flex-direction:column}
.rule-cols{flex:1;display:flex;gap:10px;align-items:stretch}
.rule-col{width:336px;background:#0b1638;border:2px solid var(--ln);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.rule-col>.btn{align-self:center;margin-top:4px}
.rc-head{display:flex;justify-content:space-between;align-items:center;font-size:18px;height:32px;color:var(--acc)}
.atom{background:var(--pn2);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
.atom-r{display:flex;gap:6px;align-items:center}
.and-lab{text-align:center;font-size:16px;color:var(--sub);height:18px;line-height:18px}
.or-lab{width:60px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--acc);writing-mode:vertical-rl;letter-spacing:6px}
.or-add{display:flex;align-items:center}
.bnav{display:flex;align-items:center;justify-content:space-between}
.bnav-l{font-size:22px;font-weight:bold;flex:1;text-align:center}
.lib{position:absolute}
.lib-empty{font-size:18px;color:var(--sub);line-height:1.5;padding:20px}
.lcard,.mcard{position:absolute;background:var(--pn);border:3px solid var(--ln);border-radius:12px;cursor:pointer;overflow:hidden}
.lcard:hover,.mcard:hover{border-color:#8fa6e6}
.lcard.sel,.mcard.sel{border-color:var(--acc)}
.lc-img{position:absolute;left:6px;right:6px;top:6px;bottom:32px;width:calc(100% - 12px);height:calc(100% - 38px);object-fit:contain;background:#0b1638;border-radius:6px}
.lc-img.ch{background:repeating-conic-gradient(#2b3f78 0 25%,#22356a 0 50%) 0 0/16px 16px}
.lc-ic{position:absolute;left:0;right:0;top:10px;bottom:36px;display:flex;align-items:center;justify-content:center;color:var(--sub)}
.lc-ic .ic{width:auto;height:auto}
.lc-n{position:absolute;left:6px;right:6px;bottom:4px;height:24px;font-size:16px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc-tag{position:absolute;right:6px;top:6px;font-size:13px;padding:1px 6px;border-radius:8px;background:#0b1638;color:var(--acc)}
.mcard .lc-img{bottom:56px;height:calc(100% - 62px)}
.mcard .lc-ic{bottom:60px}
.mcard .lc-n{bottom:28px}
.mc-u{position:absolute;left:6px;right:6px;bottom:4px;height:22px;font-size:14px;text-align:center;color:#8ce99a}
.mc-u.no{color:var(--sub)}
.lines{position:absolute}
.ln{position:absolute;display:flex;gap:8px;background:var(--pn);border:2px solid var(--ln);border-radius:10px;padding:4px 8px;cursor:pointer;overflow:hidden}
.ln:hover{border-color:#8fa6e6}
.ln.sel{border-color:var(--acc);background:#22356a}
.ln.over{border-color:#74c0fc;border-style:dashed}
.ln-k{width:96px;flex:none;font-size:14px;color:var(--sub);display:flex;flex-direction:column;justify-content:center;gap:2px}
.ln-tags{display:flex;gap:2px;color:var(--acc);height:18px}
.ln-tags .ic{width:17px;height:17px}
.ln-t{flex:1;min-width:0;font-family:var(--ftx);font-size:16px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;align-self:center}
.prev{background:#e9eefc;border:2px solid var(--ln);border-radius:8px;overflow:hidden}
.prev .bgimg{object-fit:contain}
.slot-mark{position:absolute;top:6px;transform:translateX(-50%);font-size:13px;background:#0b1638cc;color:var(--acc);padding:1px 8px;border-radius:8px}
.fx-info{font-size:15px;line-height:20px;color:var(--sub)}
.fx-info div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx-lab{font-size:17px;display:flex;align-items:center}
.mpanel{display:flex;flex-direction:column;gap:10px}
.mp-prev{height:220px;background:#0b1638;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--sub);overflow:hidden}
.mp-prev img{max-width:100%;max-height:100%;object-fit:contain}
.mp-prev .ic{width:auto;height:auto}
.mp-info{font-size:16px;color:var(--sub)}
.wk-col{display:flex;flex-direction:column;gap:12px}
.wk-row{display:flex;align-items:center;gap:10px;min-height:52px}
.wk-l{width:150px;font-size:19px;flex:none}
.wk-row .inp.sm{width:440px}
.wk-val{width:332px;height:44px;display:flex;align-items:center;justify-content:center;font-size:18px;background:#0b1638;border-radius:8px;border:2px solid var(--ln);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}

<script>
'use strict';
/* ===== util ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  addKids(el, kids);
  return el;
}
function addKids(el, kids) {
  for (const c of kids) {
    if (c == null || c === false) continue;
    if (Array.isArray(c)) addKids(el, c);
    else el.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
  }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = o => JSON.parse(JSON.stringify(o));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));
function fmtDate(t) {
  if (!t) return '';
  const d = new Date(t), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
/* ボタン（アイコン＋文字） */
function btn(icon, label, onclick, cls = '') {
  return h('button', { class: 'btn ' + cls, onclick }, icon ? ic(icon) : null, label ? h('span', null, label) : null);
}
/* トースト */
let toastTimer = 0;
function toast(msg, ms = 2400) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}
/* モーダル */
function openModal(dlg, opts = {}) {
  const m = h('div', { class: 'modal' }, dlg);
  if (opts.close) m.addEventListener('pointerdown', e => { if (e.target === m) closeModal(m); });
  $('#stage').appendChild(m);
  return m;
}
function closeModal(m) { if (m && m.parentNode) m.remove(); }
/* 確認ダイアログ：buttons=[{label,value,icon,cls}] */
function ask(msg, buttons, sub) {
  return new Promise(res => {
    let m;
    const row = h('div', { class: 'dlg-btns' }, buttons.map(b =>
      btn(b.icon, b.label, () => { closeModal(m); res(b.value); }, b.cls || '')));
    m = openModal(h('div', { class: 'dlg dlg-ask' },
      h('div', { class: 'dlg-msg' }, msg),
      sub ? h('div', { class: 'dlg-sub' }, sub) : null, row));
  });
}
const okAsk = (msg, sub) => ask(msg, [{ label: 'はい', value: true, icon: 'check' }, { label: 'いいえ', value: false, icon: 'x' }], sub);
/* ファイル選択 */
function pickFiles(accept, multiple = true) {
  return new Promise(res => {
    const i = h('input', { type: 'file', accept, style: 'display:none' });
    if (multiple) i.multiple = true;
    i.onchange = () => { res([...i.files]); i.remove(); };
    document.body.appendChild(i); i.click();
  });
}
function readAsDataURL(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
}
function readAsText(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsText(file); });
}
function download(name, text) {
  const blob = new Blob([text], { type: 'application/json' });
  const a = h('a', { href: URL.createObjectURL(blob), download: name });
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
/* 画像の縮小：背景はJPEG、人物は透明を残す（WebP） */
function shrinkImage(dataURL, kind) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const maxW = kind === 'ch' ? 1000 : 1280, maxH = kind === 'ch' ? 1000 : 960;
      const s = Math.min(1, maxW / img.width, maxH / img.height);
      const w = Math.round(img.width * s), hh = Math.round(img.height * s);
      const c = document.createElement('canvas'); c.width = w; c.height = hh;
      const g = c.getContext('2d');
      if (kind !== 'ch') { g.fillStyle = '#fff'; g.fillRect(0, 0, w, hh); }
      g.drawImage(img, 0, 0, w, hh);
      let out = kind === 'ch' ? c.toDataURL('image/webp', 0.9) : c.toDataURL('image/jpeg', 0.85);
      if (kind === 'ch' && !out.startsWith('data:image/webp')) out = c.toDataURL('image/png');
      res({ data: out, w, h: hh });
    };
    img.onerror = rej; img.src = dataURL;
  });
}
const dataSize = d => Math.round((d.length - d.indexOf(',') - 1) * 0.75);
const fmtSize = b => b >= 1048576 ? (b / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(b / 1024)) + 'KB';

function ic(name, size) {
  const span = document.createElement('span');
  span.className = 'ic';
  if (size) span.style.cssText = `width:${size}px;height:${size}px`;
  span.innerHTML = `<svg viewBox="0 0 24 24" ${size ? `width="${size}" height="${size}"` : ''} fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ''}</svg>`;
  return span;
}

/* ===== 保存（IndexedDB）と作品データ ===== */
const DB_NAME = 'novelmaker-edu', APP_ID = 'novel-maker-edu', FILE_VER = 1;
let _db = null;
function dbOpen() {
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('works')) d.createObjectStore('works', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('media')) d.createObjectStore('media', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('saves')) d.createObjectStore('saves');
    };
    r.onsuccess = () => { _db = r.result; res(_db); };
    r.onerror = () => rej(r.error);
  });
}
async function dbReq(store, mode, fn) {
  const d = await dbOpen();
  return new Promise((res, rej) => {
    const tx = d.transaction(store, mode), st = tx.objectStore(store);
    const r = fn(st);
    tx.oncomplete = () => res(r && 'result' in r ? r.result : undefined);
    tx.onerror = () => rej(tx.error);
  });
}
const dbGet = (s, k) => dbReq(s, 'readonly', st => st.get(k));
const dbPut = (s, v, k) => dbReq(s, 'readwrite', st => k === undefined ? st.put(v) : st.put(v, k));
const dbDel = (s, k) => dbReq(s, 'readwrite', st => st.delete(k));
const dbAll = s => dbReq(s, 'readonly', st => st.getAll());
const dbKeys = s => dbReq(s, 'readonly', st => st.getAllKeys());

/* ---- 作品データ ---- */
const DEF_THEME = { ui: '#1e3a7b', tx: '#ffffff' };
function newBlock(ep, slot) {
  return { id: uid(), ep, slot, text: '', cues: {}, end: { type: 'end', to: null, choices: [{ label: '', to: null }, { label: '', to: null }], rules: [], else: null, name: '' } };
}
function newWork(o) {
  const w = {
    app: APP_ID, ver: FILE_VER, id: uid(), title: o.title || 'むだい', author: o.author || '', editable: true,
    ratio: o.ratio || '16:9', opts: { title: !!o.title_, long: !!o.long, branch: !!o.branch, flag: !!o.flag, name: false },
    theme: clone(DEF_THEME), titleImg: null, blocks: {}, media: [], created: Date.now(), updated: Date.now()
  };
  const b = newBlock(1, 0); w.blocks[b.id] = b;
  return w;
}
function startBlock(w) { return Object.values(w.blocks).find(b => b.ep === 1 && b.slot === 0) || Object.values(w.blocks)[0]; }
function blocksSorted(w) { return Object.values(w.blocks).sort((a, b) => a.ep - b.ep || a.slot - b.slot); }
function blockAt(w, ep, slot) { return Object.values(w.blocks).find(b => b.ep === ep && b.slot === slot); }
function blockLabel(w, b) {
  if (!b) return '?';
  if (!w.opts.long) return '本文';
  if (b.ep === 1) return '1';
  const n = Object.values(w.blocks).filter(x => x.ep === b.ep).length;
  return (n === 1 && b.slot === 0) ? String(b.ep) : `${b.ep}-${b.slot + 1}`;
}
const CHOICE_ABC = ['A', 'B', 'C'];
function maxEp(w) { return Math.max(1, ...Object.values(w.blocks).map(b => b.ep)); }
/* 素材 */
const MEDIA = {}; // id -> dataURL（いま開いている作品の分）
async function loadMediaFor(w) {
  for (const k in MEDIA) delete MEDIA[k];
  for (const m of w.media) { const r = await dbGet('media', m.id); if (r) MEDIA[m.id] = r.data; }
}
async function saveWork(w) { w.updated = Date.now(); await dbPut('works', w); }
async function deleteWork(w) {
  for (const m of w.media) await dbDel('media', m.id);
  const keys = await dbKeys('saves');
  for (const k of keys) if (String(k).startsWith(w.id + ':')) await dbDel('saves', k);
  await dbDel('works', w.id);
}
/* 書き出し */
async function exportWork(w) {
  const media = {};
  for (const m of w.media) { const r = await dbGet('media', m.id); if (r) media[m.id] = r.data; }
  const out = clone(w); delete out.recv;
  const json = JSON.stringify({ app: APP_ID, version: FILE_VER, work: out, media });
  const name = (w.title || 'sakuhin').replace(/[\\/:*?"<>|]/g, '_') + '.json';
  download(name, json);
  toast('「' + name + '」を書き出しました');
}
/* 読みこみ */
async function importFile(file) {
  let obj;
  try { obj = JSON.parse(await readAsText(file)); } catch (e) { toast('読みこめませんでした（作品ファイルではありません）'); return null; }
  if (!obj || obj.app !== APP_ID || !obj.work || !obj.work.blocks) { toast('このアプリの作品ファイルではありません'); return null; }
  const w = obj.work, media = obj.media || {};
  const old = await dbGet('works', w.id);
  if (old) {
    const r = await ask('同じ作品がすでにあります。どうしますか？', [
      { label: 'うわがき', value: 'over', icon: 'refresh' },
      { label: '別の作品にする', value: 'new', icon: 'copy' },
      { label: 'やめる', value: 'no', icon: 'x' }], '「' + old.title + '」');
    if (r === 'no') return null;
    if (r === 'over') await deleteWork(old);
    else {
      // 別の作品として入れる：作品idと素材idを付けかえる
      const map = {};
      w.id = uid();
      for (const m of w.media) { const n = uid(); map[m.id] = n; media[n] = media[m.id]; delete media[m.id]; m.id = n; }
      const re = v => (v && map[v]) ? map[v] : v;
      w.titleImg = re(w.titleImg);
      for (const b of Object.values(w.blocks)) for (const li in b.cues) {
        const c = b.cues[li];
        if (c.bg) c.bg = re(c.bg); if (c.se) c.se = re(c.se); if (c.bgm) c.bgm = re(c.bgm);
        if (c.ch) for (const s in c.ch) c.ch[s].m = re(c.ch[s].m);
      }
    }
  }
  w.recv = true;
  for (const m of w.media) if (media[m.id]) await dbPut('media', { id: m.id, wid: w.id, data: media[m.id] });
  await dbPut('works', w);
  toast('「' + w.title + '」を読みこみました');
  return w;
}
/* 設定（端末ごと） */
const SET_DEF = { speed: 1, size: 1, width: 1, alpha: 1, wait: 1, bgm: 1, se: 1 };
const SET_OPT = {
  speed: { label: '文字送りの速さ', names: ['おそい', 'ふつう', 'はやい', 'いっき'], vals: [60, 30, 12, 0] },
  size: { label: '文字の大きさ', names: ['小', '中', '大'], vals: [28, 34, 40] },
  width: { label: 'ウインドウの横はば', names: ['せまい', 'ふつう', 'ひろい'], vals: [0.12, 0.03125, 0.01] },
  alpha: { label: 'ウインドウのこさ', names: ['こい', 'ふつう', 'うすい', 'とてもうすい'], vals: [0.92, 0.78, 0.6, 0.4] },
  wait: { label: 'オートの待ち時間', names: ['みじかい', 'ふつう', 'ながい'], vals: [800, 1600, 2800] },
  bgm: { label: 'BGMの音量', names: ['大', '中', '小', 'なし'], vals: [1, 0.6, 0.3, 0] },
  se: { label: '効果音の音量', names: ['大', '中', '小', 'なし'], vals: [1, 0.6, 0.3, 0] }
};
let SET = Object.assign({}, SET_DEF);
try { Object.assign(SET, JSON.parse(localStorage.getItem('nme_set') || '{}')); } catch (e) {}
const sv = k => SET_OPT[k].vals[clamp(SET[k], 0, SET_OPT[k].vals.length - 1)];
function saveSet() { try { localStorage.setItem('nme_set', JSON.stringify(SET)); } catch (e) {} }

/* ===== 音（Web Audio）：内蔵BGM・効果音は合成で鳴らす（素材ファイルなし） ===== */
const AU = { ctx: null, master: null, bgmG: null, seG: null, rev: null, bgm: null, bgmId: null, bufs: {} };
function auInit() {
  if (AU.ctx) { if (AU.ctx.state === 'suspended') AU.ctx.resume(); return; }
  const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
  const c = AU.ctx = new C();
  AU.master = c.createGain(); AU.master.gain.value = 0.8; AU.master.connect(c.destination);
  AU.bgmG = c.createGain(); AU.bgmG.connect(AU.master);
  AU.seG = c.createGain(); AU.seG.connect(AU.master);
  // 残響（ノイズから作るインパルス）
  const len = c.sampleRate * 1.8, ir = c.createBuffer(2, len, c.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
  AU.rev = c.createConvolver(); AU.rev.buffer = ir;
  AU.revG = c.createGain(); AU.revG.gain.value = 0.35; AU.rev.connect(AU.revG); AU.revG.connect(AU.master);
  AU.noise = c.createBuffer(1, c.sampleRate * 2, c.sampleRate);
  const nd = AU.noise.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  auVol();
}
function auVol() { if (!AU.ctx) return; AU.bgmG.gain.value = sv('bgm') * 0.55; AU.seG.gain.value = sv('se') * 0.8; }

/* ---------- 作品の設定 ---------- */
const UI_COLORS = ['#1e3a7b', '#16224a', '#1f6b4a', '#9b2335', '#5b2a86', '#6b4423', '#2b2b2b', '#c2255c'];
const TX_COLORS = ['#ffffff', '#fff6d8', '#cfe8ff', '#ffe066', '#ffc9dc', '#c3fae8', '#dddddd', '#1a1a1a'];

  const usedChoice = Object.values(w.blocks).some(b => b.end.type === 'choice' || b.end.type === 'cond') || Object.values(w.blocks).some(b => b.slot > 0);

    row('文字の色', h('div', { class: 'sw-row' }, TX_COLORS.map(c => h('button', { class: 'sw' + (w.theme.tx === c ? ' on' : ''), style: `background:${c}`, onclick: () => { w.theme.tx = c; markDirty(true); } })), colorInp(w.theme.tx, v => { w.theme.tx = v; markDirty(true); }))));
  const pv = h('div', { class: 'wk-prev' },
    w.opts.name ? h('div', { class: 'wk-pn' }, 'たろう') : null,

function colorInp(val, on) {
  const i = h('input', { type: 'color', class: 'cpick', value: val, title: '自由に色をえらぶ' });

/* 作る画面へのファイルのドロップ */
document.addEventListener('drop', e => {
  if (!$('#scr-edit').classList.contains('show') || !e.dataTransfer || !e.dataTransfer.files.length) return;
  const fs = [...e.dataTransfer.files];
  const kind = E.tab === 'fx' ? E.libKind : E.tab === 'media' ? E.medKind : (/^audio\//.test(fs[0].type) ? 'se' : 'bg');
  addMediaFiles(fs, kind);
});

/* ===== 画面の切りかえ・タイトル・作品えらび・設定 ===== */
const STAGE = { w: 1280 };
const APP = { key: null, mode: 'view', page: 0 };
function fitStage() {
  const st = $('#stage'), W = STAGE.w, H = 720;
  const s = Math.min(innerWidth / W, innerHeight / H);
  st.style.width = W + 'px';
  st.style.transform = `translate(${(innerWidth - W * s) / 2}px,${(innerHeight - H * s) / 2}px) scale(${s})`;
}
function showScreen(name) {
  $$('.screen').forEach(s => s.classList.toggle('show', s.id === 'scr-' + name));
  $$('.modal').forEach(m => m.remove());
  APP.key = null;
}
/* ---- タイトル ---- */
function gotoTitle() {
  setStageW(1280); stopBGM();
  const s = $('#scr-title'); s.innerHTML = '';
  s.append(
    h('div', { class: 'tt-logo' }, 'ノベルゲームメーカー'),
    h('div', { class: 'tt-sub' }, 'きょういく版'),
    h('div', { class: 'tt-btns' },
      btn('book', '見る', () => gotoSelect('view'), 'big'),
      btn('text', '作る', () => gotoSelect('make'), 'big'),
      btn('load', 'もらった作品を読みこむ', () => importDialog(), 'big')),
    btn('gear', '設定', () => openSettings(), 'tr'));
  showScreen('title');
}
async function importDialog() {
  const fs = await pickFiles('.json,application/json');
  let last = null;
  for (const f of fs) { const w = await importFile(f); if (w) last = w; }
  if (last && $('#scr-select').classList.contains('show')) gotoSelect(APP.mode, APP.page);
  return last;
}
/* ---- 作品えらび ---- */
async function gotoSelect(mode, page = 0) {
  setStageW(1280); stopBGM();
  APP.mode = mode; APP.page = page;
  const works = (await dbAll('works')).sort((a, b) => b.updated - a.updated);
  const items = mode === 'make' ? ['new', ...works] : works;
  const per = 6, pages = Math.max(1, Math.ceil(items.length / per)); page = clamp(page, 0, pages - 1); APP.page = page;
  const s = $('#scr-select'); s.innerHTML = '';
  s.append(btn('back', 'もどる', () => gotoTitle(), 'tl'),
    h('div', { class: 'sc-title' }, mode === 'make' ? '作る作品をえらぶ' : '見る作品をえらぶ'),
    btn('gear', '設定', () => openSettings(), 'tr'));
  const grid = h('div', { class: 'cards' });
  items.slice(page * per, page * per + per).forEach(w => {
    if (w === 'new') { grid.appendChild(h('button', { class: 'card card-new', onclick: () => newWorkDialog() }, ic('plus', 56), h('div', null, '新しく作る'))); return; }
    const nb = Object.keys(w.blocks).length;
    const card = h('div', { class: 'card', onclick: () => openWork(w) },
      h('div', { class: 'card-t' }, w.title || 'むだい'),
      h('div', { class: 'card-a' }, w.author ? 'さく：' + w.author : 'さく：（なし）'),
      h('div', { class: 'tags' },
        w.recv ? h('span', { class: 'tag recv' }, 'もらった') : null,
        h('span', { class: 'tag' }, w.ratio),
        h('span', { class: 'tag' }, 'ブロック ' + nb),
        w.editable ? null : h('span', { class: 'tag lock' }, ic('lock', 16), '改造だめ')),
      h('div', { class: 'card-d' }, '更新 ' + fmtDate(w.updated)),
      h('div', { class: 'card-btns' },
        btn('down', '書き出す', e => { e.stopPropagation(); exportWork(w); }, 'sm'),
        mode === 'make' ? btn('trash', '消す', async e => {
          e.stopPropagation();
          if (await okAsk('「' + w.title + '」を消しますか？', 'もとにもどせません')) { await deleteWork(w); gotoSelect(mode, page); }
        }, 'sm') : null));
    if (mode === 'make' && !w.editable) card.classList.add('locked');
    grid.appendChild(card);
  });
  if (!items.length) grid.appendChild(h('div', { class: 'empty-msg' }, 'まだ作品がありません。「作る」で作るか、もらった作品を読みこんでください。'));
  s.append(grid, h('div', { class: 'pager' },
    btn('prev', '前へ', () => gotoSelect(mode, page - 1), page > 0 ? '' : 'dis'),
    h('div', { class: 'pg-n' }, `${page + 1} / ${pages}`),
    btn('next', '次へ', () => gotoSelect(mode, page + 1), page < pages - 1 ? '' : 'dis'),

  $$('.dis', s).forEach(b => b.disabled = true);

}
async function openWork(w) {
  if (APP.mode === 'make') {
    if (!w.editable) { toast('この作品は、作者が「改造だめ」にしています'); return; }
    openEditor(w);
  } else playWork(w, { onBack: () => gotoSelect('view', APP.page) });
}
/* ---- 新しく作る ---- */
function newWorkDialog() {
  const o = { title: '', author: '', title_: true, long: true, branch: true, flag: false, ratio: '16:9' };
  let m;
  const ti = h('input', { class: 'inp', maxlength: 30, placeholder: '作品のタイトル' });
  const au = h('input', { class: 'inp', maxlength: 16, placeholder: '作者名（ニックネームでもOK）' });
  const rows = h('div', { class: 'wz-rows' });
  const choice = (key, label, opts) => {
    const r = h('div', { class: 'wz-row' }, h('div', { class: 'wz-l' }, label));
    const bs = opts.map(([v, lb, icn]) => { const b = btn(icn, lb, () => { o[key] = v; draw(); }, 'opt'); b._v = v; r.appendChild(b); return b; });
    r._upd = () => { bs.forEach(b => { b.classList.toggle('on', o[key] === b._v); }); };
    r._key = key; return r;
  };
  const r0 = choice('title_', 'タイトル画面', [[true, 'つける', 'check'], [false, 'つけない', 'x']]);
  const r1 = choice('long', 'シナリオの長さ', [[true, '長いシナリオ', 'map'], [false, '1話完結', 'text']]);
  const r2 = choice('branch', '選択肢で分岐', [[true, 'する', 'branch'], [false, 'しない', 'arrow']]);
  const r3 = choice('flag', 'イベントフラグ', [[true, '使う', 'flag'], [false, '使わない', 'x']]);
  const r4 = choice('ratio', '画面の形', [['16:9', '16:9（横長）', 'image'], ['4:3', '4:3', 'image']]);
  function draw() {
    if (!o.long) { o.branch = false; o.flag = false; }
    if (!o.branch) o.flag = false;
    [r0, r1, r2, r3, r4].forEach(r => r._upd());
    r2.classList.toggle('off', !o.long); r3.classList.toggle('off', !o.branch);
    $$('button', r2).forEach(b => b.disabled = !o.long); $$('button', r3).forEach(b => b.disabled = !o.branch);
  }
  rows.append(h('div', { class: 'wz-row' }, h('div', { class: 'wz-l' }, 'タイトル'), ti),
    h('div', { class: 'wz-row' }, h('div', { class: 'wz-l' }, '作者名'), au), r0, r1, r2, r3, r4);
  draw();
  m = openModal(h('div', { class: 'dlg dlg-wz' }, h('div', { class: 'dlg-title' }, '新しく作る'), rows,
    h('div', { class: 'dlg-btns' },
      btn('check', '作る', async () => {
        o.title = ti.value.trim() || 'むだい'; o.author = au.value.trim();
        const w = newWork(o); await saveWork(w); closeModal(m); openEditor(w);
      }),
      btn('x', 'やめる', () => closeModal(m)))));
  setTimeout(() => ti.focus(), 50);
}
/* ---- 設定 ---- */
function openSettings() {
  let m, tab = 0;
  const body = h('div', { class: 'set-body' });
  const tabs = h('div', { class: 'set-tabs' });
  const T = [['sliders', '表示・再生', ['speed', 'size', 'width', 'alpha', 'wait']], ['sound', '音・データ', ['bgm', 'se']]];
  function draw() {
    tabs.innerHTML = ''; body.innerHTML = '';
    T.forEach((t, i) => tabs.appendChild(btn(t[0], t[1], () => { tab = i; draw(); }, 'opt' + (i === tab ? ' on' : ''))));
    for (const k of T[tab][2]) {
      const d = SET_OPT[k];
      body.appendChild(h('div', { class: 'set-row' }, h('div', { class: 'set-l' }, d.label),
        d.names.map((n, i) => btn(null, n, () => { SET[k] = i; saveSet(); auVol(); draw(); settingsChanged(k); }, 'opt' + (SET[k] === i ? ' on' : '')))));
    }
    if (tab === 1) {
      const cur = curOpenWork();
      body.appendChild(h('div', { class: 'set-row set-data' },
        btn('home', 'タイトルへ', async () => { closeModal(m); if (P.typing) stopTyping(); gotoTitle(); }),
        btn('down', '作品を書き出す', () => { if (cur) exportWork(cur); }, cur ? '' : 'dis'),
        btn('load', '作品を読みこむ', async () => { closeModal(m); await importDialog(); })));
      $$('.dis', body).forEach(b => b.disabled = true);
      body.appendChild(h('div', { class: 'set-note' }, '内蔵のBGM・効果音は、このアプリが自分で作っている音です（素材ファイルは使っていません）。'));
    }
  }
  draw();
  m = openModal(h('div', { class: 'dlg dlg-set' }, h('div', { class: 'dlg-title' }, '設定'), tabs, body,
    h('div', { class: 'dlg-btns' }, btn('x', 'とじる', () => closeModal(m)))), { close: true });
}
function curOpenWork() {
  if ($('#scr-play').classList.contains('show')) return P.w;
  if ($('#scr-edit').classList.contains('show')) return E.w;
  return null;
}
function settingsChanged(k) {
  if (['size', 'width', 'alpha'].includes(k)) {
    if ($('#scr-play').classList.contains('show')) playerRelayout();
    if ($('#scr-edit').classList.contains('show')) editorRefresh();
  }
}
/* ---- 起動 ---- */
window.addEventListener('resize', fitStage);
window.addEventListener('keydown', e => {
  if (e.target.matches && e.target.matches('input,textarea,select')) { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.key === 'Escape') { const ms = $$('.modal'); if (ms.length) { ms[ms.length - 1].remove(); return; } }
  if (APP.key) APP.key(e);
});
window.addEventListener('pointerdown', () => auInit(), { capture: true });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', async e => {
  e.preventDefault();
  if (e.defaultPrevented && e._handled) return;
  const fs = [...(e.dataTransfer?.files || [])];
  if ($('#scr-edit').classList.contains('show')) return; // 作る画面は素材として受けとる
  const js = fs.filter(f => /\.json$/i.test(f.name));
  for (const f of js) await importFile(f);
  if (js.length && $('#scr-select').classList.contains('show')) gotoSelect(APP.mode, APP.page);
});
window.addEventListener('DOMContentLoaded', () => { fitStage(); gotoTitle(); });

</script>
